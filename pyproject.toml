[project]
name = "digest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Titouan Nicol", email = "t.nicol@audencia.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "ebooklib>=0.21",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langgraph>=1.2.21",
    "trafilatura>=2.3.1",
]

[project.scripts]
digest = "digest:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
