# Sources of the digest: 2 per section, plus 2 raw Reddit sources in "data".
# Re-run scripts/probe_sources.py after any change:
# a source is kept only if its feed works, has publication dates and readable full text.
#
# kind:    "hn" (Hacker News JSON API) or "feed" (RSS / Atom)
# section: "data", "monde", "eco" or "france"
#
# Dropped after probing on 2026-11-14:
# - Les Echos: feed URL answered 503, lesechos.fr answers 403 to non-browser clients
#   (anti-bot), and most articles are paywalled anyway.
# - Le Monde (international, economie, politique): feeds work, but every article page
#   returned an anti-bot page (286 chars, "disable any ad blockers...") instead of the text.

# --- data ---
[[sources]]
name = "hackernews"
kind = "hn"
section = "data"
url = "https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30"

# Reddit: one source per subreddit. raw = true: posts shown as written (never
# summarized), and the best post of each subreddit is added on top of the quotas.
# Not one combined feed (r/a+b): its top was 100% r/MachineLearning on 2026-11-14,
# so r/datascience could never be guaranteed (and ?limit= is ignored by the RSS feed).
# delay_s: Reddit answers 429 to two requests in a row, so the second one waits.
[[sources]]
name = "reddit/datascience"
kind = "feed"
section = "data"
url = "https://www.reddit.com/r/datascience/top/.rss?t=day"
raw = true

[[sources]]
name = "reddit/MachineLearning"
kind = "feed"
section = "data"
url = "https://www.reddit.com/r/MachineLearning/top/.rss?t=day"
raw = true
delay_s = 10

# --- monde ---
[[sources]]
name = "bbc/world"
kind = "feed"
section = "monde"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"

[[sources]]
name = "guardian/world"
kind = "feed"
section = "monde"
url = "https://www.theguardian.com/world/rss"

# --- eco ---
[[sources]]
name = "bbc/business"
kind = "feed"
section = "eco"
url = "https://feeds.bbci.co.uk/news/business/rss.xml"

[[sources]]
name = "franceinfo/economie"
kind = "feed"
section = "eco"
url = "https://www.francetvinfo.fr/economie.rss"

# --- france ---
[[sources]]
name = "franceinfo/politique"
kind = "feed"
section = "france"
url = "https://www.francetvinfo.fr/politique.rss"

[[sources]]
name = "theconversation/fr"
kind = "feed"
section = "france"
# French-language articles only: the FR edition feed (/fr/articles.atom) also
# republishes English articles, which would land in the "france" section.
url = "https://theconversation.com/articles.atom?language=fr"
