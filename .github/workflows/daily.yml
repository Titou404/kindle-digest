name: Daily digest

on:
  schedule:
    # Cron is in UTC: 4:30 UTC = 5:30 in Paris in winter (6:30 in summer).
    # Scheduled runs can start late when GitHub is busy: early on purpose.
    - cron: "30 4 * * *"
  workflow_dispatch: # "Run workflow" button: for tests and demos
    inputs:
      send:
        description: "Send the journal to the Kindle"
        type: boolean
        default: true

permissions:
  contents: write # to commit the run report into runs/

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no "v10" shortcut tag, only exact versions.
      - uses: astral-sh/setup-uv@v10.3.3

      # Exact versions from uv.lock; uv installs the Python of .python-version (3.12).
      - run: uv sync --locked

      - name: Build and send the journal
        run: uv run python -m digest
        env:
          # The cron always sends; a manual run sends unless "send" is unticked.
          SEND: ${{ (github.event_name == 'schedule' || inputs.send) && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}

      # The measures of each production run are kept in the repository: artifacts expire.
      # Runs even when sending failed, so that the failure itself is recorded.
      - name: Commit the run report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/
          if git diff --cached --quiet; then
            echo "No new report to commit."
          else
            git commit -m "Ajouter le rapport du run du $(TZ=Europe/Paris date +%d/%m/%Y)"
            git pull --rebase  # in case main moved during the run
            git push
          fi

      # Keep the journal and its measures, even when a step failed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: digest-${{ github.run_number }}
          path: |
            out/*.epub
            runs/*.json
          retention-days: 30
