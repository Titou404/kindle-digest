# Configurations of the evaluation bench, replayed on a frozen day (eval/fixtures/).
#
# Each config changes ONE setting compared to its reference (S1 for summaries, R1 for
# ranking), so that any difference can be attributed to that setting. Testing every
# combination (3 models x 3 efforts x 2 lengths x 2 prompts = 36 configs) would cost far
# more and answer questions nobody asked.
#
# repeats: the model does not answer the same way twice (e.g. rank once skipped thinking
# entirely). Repeating a config measures this noise: a difference between two configs
# smaller than the difference between two runs of the same config means nothing.
# Cheap Haiku configs are repeated 3 times; Sonnet ones, 20x more expensive, less.
#
# Not tested, settled without paying:
# - Opus 5.5 (40x Haiku's price): would never be chosen for a 1-cent daily journal.
# - Prompt caching (E5): the summarize prompt is below the 512-token minimum, and rank runs
#   once a day while the cache lives 5 minutes. Only worth testing if R5 wins.

# ---------- Summaries: 12 frozen articles ----------

[[configs]]
id = "S1"
task = "summarize"
question = "Référence : le réglage de production."
model = "claude-haiku-5-5"
effort = "medium"
prompt = "v1"
max_text = 20000
repeats = 3

[[configs]]
id = "S2"
task = "summarize"
question = "E3 : autant de qualité avec moins d'effort, pour moins cher ?"
